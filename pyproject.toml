[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mandate-firewall"
version = "0.1.0b1"
description = "Wallet-agnostic firewall that verifies AI agent transactions against the user's mandate (beta)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Afif Kawalit" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "web3>=7.0",
]

[project.urls]
Homepage = "https://github.com/Afif-K/mandate-firewall"
Source = "https://github.com/Afif-K/mandate-firewall"
Issues = "https://github.com/Afif-K/mandate-firewall/issues"
"Threat model" = "https://github.com/Afif-K/mandate-firewall/blob/main/THREAT_MODEL.md"

[project.scripts]
mandate-firewall = "mandate_firewall.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mandate_firewall"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]

[tool.ruff.format]
# Plans under docs/ are approved records. Their Python sketches are compact on
# purpose (and often not valid Python), so the formatter leaves them alone.
exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; hardcoded keys in tests are public Anvil throwaway keys.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "anvil: integration test that needs a local anvil binary (skipped if missing)",
    "forge: test that runs Foundry's forge (skipped if missing)",
    "llm: live call to the LLM API; costs money, so opt-in only: pytest -m llm",
    "benchmark: a scenario-suite cell (51, about a minute); opt-in locally: pytest -m benchmark. CI runs them",
]
# Live LLM tests and the scenario-suite cells don't run by default. A later -m on the
# command line replaces this one (CI runs -m "not llm").
addopts = ["-m", "not llm and not benchmark"]
# Starlette's TestClient prefers httpx2 and warns when falling back to httpx. We use
# httpx on purpose (see docs/m2-plan.md, decision 4); silence only that one message.
filterwarnings = [
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning',
]
